<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h1>Course Registration Form</h1>
      <form action="server.html" method="get" autocomplete="on">
          <fieldset>
            <legend>Personal Details</legend>
            <label for="">First Name</label>
            <input type="text" name="firstname" placeholder="Ex: Anshu" required> <br><br>
            <label for="">SurName</label>
            <input type="text" name="surname" placeholder="Ex: Sai" required> <br><br>
            <label for="">Mobile Number</label>
            <input type="text" name="Mobile"> <br><br>
            <label for="">Email</label>
            <input type="email" name="email" placeholder="Ex: Anshu@gmail.com"> <br><br>
            <label for="">Password</label>
            <input type="Password"> <br><br>
            <label for="">Confirm Password</label>
            <input type="Password"> <br><br>
            <label for="">Date of Birth</label>
            <input type="Date"> <br><br>
            <label for="">Age</label>
            <input type="number"> <br><br>
            <label for="">Gender</label>
            <input name="Gender" type="radio" value="M">
            <label for="">Male</label>
            <input name="Gender" type="radio" value="F">
            <label for="">Female</label>
            <input name="Gender" type="radio" value="O">
            <label for="">Others</label> <br><br>
            <label for="">Select Country</label>
            <Select name="" id="">
                  <option value="">India</option>
                  <option value="">USA</option>
                  <option value="">UAE</option>
                  <option value="">Pakistan</option>
                  <option value="">Thailand</option>
                  <option value="">Russia</option>
                  <option value="">Germany</option>
                  <option value="">Canada</option>
                  <option value="">Nepal</option>
                  <option value="">London</option>
            </Select> <br><br>
            <label for="">Upload Picture</label>
            <input type="File"> <br><br>
            </fieldset>
            <button type="reset">Clear</button>

            <fieldset>
                  <legend>Course Details</legend>
                  <label for=""'>Select Course</label>
                  <Select name="Course" id="">
                        <option value="JFS">Java Full Stack</option>
                        <option value="PES">Python Full Stack</option>
                        <option value="DA">Data Analysis</option>
                        <option value="ML">Machine Learning</option>
                        <option value="DEV">Devops</option>
                  </Select> <br><br>
                  <label for="">Delivery Mode</label><br>
                  <input type="checkbox" name="mode" value="Online">Online
                  <input type="checkbox" name="mode" value="Offline">Offline
                  <br><br>
                  

                  <label for="">Comments</label>
                  <textarea name="comments" rows="10" cols="40"></textarea>
                  
            </fieldset>
            <input type="submit">
      </form>
    
</body>
</html>
