<!DOCTYPE html>
<html lang="en">
<head>
   <title>Document</title>
   <style>
       body{background-color: grey;}
       h1{background-color: yellow; color: red;}
       p:not(div p){background-color: powderblue;color: black;}
       div p{background-color: orange;color: blue;}
       div>p{background-color: cyan;color: brown;}
       div div p{background-color: navy;color: pink;}
       div>p:first-of-type{background-color: tomato;}
       span p{background-color: pink;color: darkblue;}
       div div p{background-color: lightgreen;color: maroon;}
       div div>p{background-color: lightyellow;color: purple;}
       span {background-color: lightgray;}
   </style>
</head>
<body>
     <h1>h1 Header header</h1>
     <p id="firstp">p outside div</p>
     <div>
        <p>p being directly inside div</p>
        <span>
            <p>p inside span inside div</p>
        </span>
        <span>
        <p>p inside span inside div</p>
        </span>
        <p>p directly inside div</p>
        <div class="nesteddiv">
            <p>p inside nested div</p>
            <span>
                <p>p inside span inside nested div</p>
            </span>
            <span>
                <p>p inside span inside nested div</p>
            </span>
            <p>p inside nested div</p>
        </div>
        <p>p directly inside div</p>
     </div>
     <p>p outside div</p>
     <input type="text">
</body>
</html>
